<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fábrica — By Nina</title>
<style>
  :root {
    --bg:#f7f5f2;--surface:#fff;--surface2:#f0ede9;--border:#e2ddd8;--border2:#ccc8c2;
    --text:#1a1714;--text2:#6b6560;--text3:#a09890;
    --accent:#2d6a4f;--accent-bg:#e8f4ef;
    --danger:#991b1b;--danger-bg:#fee2e2;
    --warn-bg:#fef3c7;--warn-text:#92400e;
    --green-bg:#dcfce7;--green-text:#166534;
    --radius:10px;--shadow:0 1px 3px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

  #login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .login-card{background:var(--surface);border-radius:16px;padding:40px 32px;width:100%;max-width:360px;box-shadow:0 4px 24px rgba(0,0,0,.1);text-align:center}
  .login-logo{font-size:13px;font-weight:700;letter-spacing:3px;color:var(--text3);text-transform:uppercase;margin-bottom:8px}
  .login-title{font-size:22px;font-weight:700;margin-bottom:4px}
  .login-sub{font-size:13px;color:var(--text2);margin-bottom:32px}
  .user-btn{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:var(--radius);border:1.5px solid var(--border);background:var(--surface);cursor:pointer;margin-bottom:10px;transition:all .15s;text-align:left}
  .user-btn:hover{border-color:var(--accent);background:var(--accent-bg)}
  .user-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0}
  .uname{font-size:14px;font-weight:600}.urole{font-size:11px;color:var(--text2)}

  #app{display:none}
  .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
  .topbar-left{display:flex;align-items:center;gap:8px}
  .topbar-logo{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--text3);text-transform:uppercase}
  .topbar-title{font-size:15px;font-weight:600}
  .user-chip{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;background:var(--surface2);font-size:12px;font-weight:500;color:var(--text2);cursor:pointer}
  .notif-btn{position:relative;width:34px;height:34px;border-radius:50%;border:none;background:var(--surface2);cursor:pointer;font-size:16px;margin-right:6px}
  .notif-badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:8px;background:var(--danger);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px}

  .main{max-width:720px;margin:0 auto;padding:16px}
  .tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--surface2);border-radius:var(--radius);padding:3px}
  .tab{flex:1;padding:7px;border-radius:8px;border:none;background:transparent;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer}
  .tab.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow);font-weight:600}

  .section{margin-bottom:14px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .sec-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer}
  .sec-left{display:flex;align-items:center;gap:8px}
  .sec-title{font-size:13px;font-weight:600}
  .sec-count{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;background:rgba(255,255,255,.25)}
  .sec-body{border-top:1px solid rgba(0,0,0,.07)}
  .sec-add{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--border);background:var(--surface)}
  .sec-add input{flex:1;font-size:12px;border:1px solid var(--border);border-radius:6px;padding:6px 10px;background:var(--bg);color:var(--text)}
  .sec-add input:focus{outline:none;border-color:var(--accent)}
  .sec-add button{font-size:12px;padding:6px 10px;border-radius:6px;border:none;background:var(--accent);color:#fff;cursor:pointer}

  .item{background:var(--surface);padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px}
  .item:last-of-type{border-bottom:none}
  .item-check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border2);background:transparent;cursor:pointer;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:700;transition:all .15s}
  .item-check.checked{background:var(--accent);border-color:var(--accent)}
  .item-body{flex:1;min-width:0}
  .item-code{font-size:13px;font-weight:600}
  .item-code-edit{font-size:13px;font-weight:600;border:1px dashed transparent;border-radius:4px;padding:1px 4px;cursor:text;display:inline-block}
  .item-code-edit:hover{border-color:var(--border2);background:var(--surface2)}
  .item-name{font-size:12px;color:var(--text2);margin-top:1px}
  .item.done .item-code,.item.done .item-name{text-decoration:line-through;color:var(--text3)}
  .item-actions{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap;align-items:center}

  /* CORTADA PANEL */
  .cortada-panel{margin-top:10px;background:var(--surface2);border-radius:8px;border:1px solid var(--border);overflow:hidden}
  .cortada-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .cortada-row>.c-label{flex:1;min-width:140px}
  .cortada-row>.btn-advance,.cortada-row>.btn-sm{flex-shrink:0}
  .cortada-row:last-child{border-bottom:none}
  .c-check{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--border2);background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:all .15s}
  .c-check.checked{background:var(--accent);border-color:var(--accent)}
  .c-check.checked-auto{cursor:default}
  .c-check.checked-auto.checked{background:#16a34a;border-color:#16a34a}
  .item-highlight{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px;transition:outline .2s}
  .c-label{font-size:12px;color:var(--text2);flex:1}
  .c-label.done{color:var(--text3);text-decoration:line-through}
  .radio-group{display:flex;gap:6px}
  .radio-btn{padding:4px 12px;border-radius:20px;border:1.5px solid var(--border2);background:transparent;font-size:11px;cursor:pointer;color:var(--text2);transition:all .15s;font-weight:500}
  .radio-btn.selected{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:600}

  /* AVÍOS dentro cortada */
  .avios-sub{display:flex;flex-direction:column}
  .avio-item{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 32px;border-top:1px solid var(--border);flex-wrap:wrap}
  .avio-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .avio-name{font-size:11px;color:var(--text2);flex:1;min-width:0}
  .avio-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500;white-space:nowrap}
  .avio-btn{font-size:10px;padding:2px 8px;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;white-space:nowrap}
  .avio-btn:hover{background:var(--surface)}
  .avio-btn.green{border-color:var(--accent);color:var(--accent)}

  /* AVÍOS secciones normales */
  .avios-normal{margin-top:7px;display:flex;flex-direction:column;gap:4px}
  .avio-row-n{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

  .btn-sm{font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer}
  .btn-sm:hover{background:var(--surface2)}
  .btn-danger{font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid var(--danger);background:transparent;color:var(--danger);cursor:pointer}
  .btn-advance{font-size:11px;padding:5px 12px;border-radius:6px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-weight:600}
  .move-select{font-size:11px;border:1px solid var(--border2);border-radius:6px;padding:3px 6px;background:var(--bg);color:var(--text);cursor:pointer;max-width:180px}

  /* LISTO badge */
  .listo-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 12px;border-radius:20px;font-weight:600;background:var(--green-bg);color:var(--green-text);margin-top:6px}

  .enviar-taller-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}

  .en-taller-panel{margin-top:8px;background:var(--surface2);border-radius:8px;border:1px solid var(--border);padding:4px 0}
  .en-taller-row{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;font-size:12px}
  .et-label{color:var(--text2)}
  .et-val{color:var(--text);font-weight:500}

  /* DISEÑO / PROBAR MUESTRA */
  .mod-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 12px;border-radius:20px;font-weight:600;background:var(--warn-bg);color:var(--warn-text);margin-top:6px}
  .diseno-panel{margin-top:10px;background:var(--surface2);border-radius:8px;border:1px solid var(--border);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
  .diseno-field-label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.4px}
  .mod-textarea{width:100%;font-size:12px;border:1px solid var(--border);border-radius:6px;padding:8px;background:var(--surface);color:var(--text);resize:vertical;min-height:54px;font-family:inherit}
  .mod-textarea:focus{outline:none;border-color:var(--accent)}
  .diseno-fotos-grid{display:flex;gap:6px;flex-wrap:wrap}
  .diseno-foto-item{position:relative;width:56px;height:56px}
  .diseno-foto-item img{width:100%;height:100%;border-radius:8px;object-fit:cover;cursor:pointer;background:var(--surface);border:1px solid var(--border)}
  .diseno-foto-del{position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;background:var(--danger);color:#fff;border:none;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
  .diseno-add-foto{width:56px;height:56px;border-radius:8px;background:var(--surface);border:1.5px dashed var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--text3)}
  .btn-approve{font-size:11px;padding:6px 12px;border-radius:6px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-weight:600}
  .btn-revision{font-size:11px;padding:6px 12px;border-radius:6px;border:1px solid var(--warn-text);background:transparent;color:var(--warn-text);cursor:pointer;font-weight:600}
  .mod-ref-box{margin-top:8px;background:var(--warn-bg);border-radius:8px;padding:8px 10px;font-size:11px;color:var(--warn-text)}
  .mod-ref-box .mod-ref-title{font-weight:700;margin-bottom:4px}

  /* FOTO */
  .item-with-photo{display:flex;gap:10px;width:100%;min-width:0}
  .pasos-panel{flex:1;min-width:210px;max-width:260px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;align-self:flex-start}
  .pasos-panel-title{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text2);margin-bottom:8px}
  .paso-row{display:flex;flex-direction:column;gap:2px;padding:6px 0;border-top:1px dashed var(--border)}
  .paso-row:first-of-type{border-top:none}
  .paso-label{font-size:11px;font-weight:600;color:var(--text)}
  .paso-resp{font-weight:400;color:var(--text3);font-size:10px;margin-left:5px}
  .paso-done{font-size:11px;color:var(--green-text,#2f7a4a)}
  .paso-pendiente{font-size:11px;color:var(--warn-text)}
  .paso-pendiente.paso-urgente{color:#dc2626;font-weight:700}
  .paso-inactivo{font-size:11px;color:var(--text3)}
  .paso-row.paso-activo{background:var(--warn-bg);margin:0 -12px;padding:6px 12px;border-radius:6px}

  .deuda-taller-box{margin:2px 18px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 14px}
  .deuda-taller-title{font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--text2);margin-bottom:6px}
  .deuda-taller-row{display:flex;align-items:center;gap:10px;padding:5px 0;border-top:1px dashed var(--border);flex-wrap:wrap}
  .deuda-taller-row:first-of-type{border-top:none}
  .deuda-taller-nombre{font-size:13px;font-weight:600;flex:1;min-width:100px}
  .deuda-taller-cant{font-size:12px;color:var(--text2);background:var(--bg);border-radius:20px;padding:2px 10px}
  .deuda-taller-dias{font-size:11px;color:var(--text2)}
  .deuda-taller-dias.urgente{color:#dc2626;font-weight:700}
  .deuda-taller-group{border-top:1px dashed var(--border)}
  .deuda-taller-group:first-child{border-top:none}
  .deuda-taller-group .deuda-taller-row{border-top:none}
  .deuda-taller-caret{margin-left:auto;font-size:11px;color:var(--text3);transition:transform .15s}
  .deuda-taller-group.open .deuda-taller-caret{transform:rotate(180deg)}
  .deuda-taller-detalle{display:none;padding:0 0 8px 4px}
  .deuda-taller-group.open .deuda-taller-detalle{display:block}
  .deuda-taller-item{display:flex;align-items:center;gap:10px;padding:3px 0;font-size:11px;color:var(--text2)}
  .dti-corte{font-weight:700;color:var(--text);min-width:70px}
  .dti-articulo{flex:1}
  .dti-tela{color:var(--text3);font-style:italic}
  .dti-dias{font-size:11px;color:var(--text2);min-width:50px;text-align:right}
  .dti-dias.urgente{color:#dc2626;font-weight:700}

  .filtro-corte-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 18px;background:var(--surface2);border-bottom:1px solid var(--border)}
  .filtro-corte-select, .filtro-corte-input{font-size:12px;border:1px solid var(--border2);border-radius:6px;padding:5px 8px;background:var(--bg);color:var(--text)}
  .filtro-corte-input{width:130px}

  .galeria-hint{font-size:12px;color:var(--text2);margin-bottom:12px}
  .galeria-board{margin-bottom:26px}
  .galeria-board-title{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .galeria-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .galeria-tile{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface);cursor:grab;transition:opacity .12s,transform .12s}
  .galeria-tile.dragging{opacity:.35}
  .galeria-tile img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:pointer}
  .galeria-tile-sinfoto{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--text3);font-size:1.6rem}
  .galeria-tile-info{padding:6px 8px;display:flex;flex-direction:column;gap:1px}
  .galeria-tile-code{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .galeria-tile-etapa{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;padding:2px 6px;border-radius:20px;width:fit-content}
  .galeria-tile-etapa.etapa-diseno{background:#ede9fe;color:#6d28d9}
  .galeria-tile-etapa.etapa-fabrica{background:#dbeafe;color:#1d4ed8}
  .galeria-tile-etapa.etapa-finalizados{background:#dcfce7;color:#15803d}
  .galeria-tile-sec{font-size:9px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item-photo{width:100px;height:100px;border-radius:8px;object-fit:cover;object-position:top center;flex-shrink:0;cursor:pointer;background:var(--surface2);border:1px solid var(--border)}
  .item-photo-wrap{position:relative;width:100px;height:100px;flex-shrink:0}
  .item-photo-wrap.small,.item-photo-wrap.small .item-photo{width:56px;height:56px}
  .item-photo-placeholder.small{width:56px;height:56px}
  .photo-edit-btn{position:absolute;bottom:-4px;right:-4px;width:22px;height:22px;border-radius:50%;background:var(--surface);border:1px solid var(--border2);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);padding:0}
  .item-photo-placeholder{width:100px;height:100px;border-radius:8px;flex-shrink:0;background:var(--surface2);border:1.5px dashed var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:22px;color:var(--text3)}
  .idea-tela-row{display:flex;align-items:center;gap:8px;margin-top:8px}
  .modelista-row{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}
  .modelista-label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
  .modelista-select{font-size:12px;border:1px solid var(--border2);border-radius:6px;padding:4px 8px;background:var(--bg);color:var(--text)}
  .responsable-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 12px;border-radius:20px;font-weight:600;background:var(--accent-bg);color:var(--accent);margin:4px 0}
  .pendientes-group-title{font-size:13px;font-weight:700;margin:18px 0 8px;color:var(--text);display:flex;align-items:center;gap:8px}
  .pendientes-group-title:first-child{margin-top:0}
  .pendientes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
  .pendientes-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:0}
  .pendientes-etapa{font-size:11px;color:var(--text2);margin-top:2px}
  .photo-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}
  .photo-modal-img{max-width:100%;max-height:90vh;border-radius:8px}
  .photo-modal-close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:20px;cursor:pointer}
  .photo-upload-label{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 7px;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer}
  .photo-uploading{font-size:10px;color:var(--text3)}

  /* NOMBRE inline editable */
  .item-name-edit{font-size:12px;color:var(--text2);border:1px dashed transparent;border-radius:4px;padding:1px 4px;margin-top:1px;cursor:text;display:inline-block;min-height:16px}
  .item-name-edit:hover{border-color:var(--border2);background:var(--surface2)}
  .item-name-edit:empty:before{content:'+ agregar nombre';color:var(--text3);font-style:italic}
  .item-name-edit-input{font-size:12px;border:1px solid var(--accent);border-radius:4px;padding:2px 6px;width:100%;margin-top:2px;background:var(--surface)}

  .stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
  .search-input{width:100%;box-sizing:border-box;font-size:13px;border:1px solid var(--border);border-radius:8px;padding:9px 12px;background:var(--bg);color:var(--text);margin-bottom:10px}
  .search-input:focus{outline:none;border-color:var(--accent)}
  .alert-banner-item{font-size:12px;font-weight:600;border-radius:8px;padding:8px 12px;margin-bottom:8px}
  .stat-card{background:var(--surface);border-radius:var(--radius);padding:10px 12px;text-align:center;box-shadow:var(--shadow)}
  .stat-num{font-size:22px;font-weight:700}.stat-label{font-size:10px;color:var(--text3);margin-top:2px}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal{background:var(--surface);border-radius:14px;width:100%;max-width:440px;max-height:85vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.18)}
  .modal-header{padding:16px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .modal-title{font-size:15px;font-weight:700}
  .modal-close{font-size:22px;background:none;border:none;cursor:pointer;color:var(--text2);line-height:1}
  .modal-body{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
  .modal-footer{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
  .field label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}

  .notif-panel{position:fixed;top:52px;right:8px;width:320px;max-height:70vh;background:var(--surface);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.15);border:1px solid var(--border);z-index:150;overflow:hidden;display:flex;flex-direction:column}

// Cloudinary config (mismo que otras apps By Nina)
const CLOUDINARY_CLOUD = 'dt6ijkpyy';
const CLOUDINARY_PRESET = 'By Nina';

function openPhotoModal(url){
  document.getElementById('photo-modal-img').src = url;
  document.getElementById('photo-modal').classList.remove('hidden');
}
function closePhotoModal(){
  document.getElementById('photo-modal').classList.add('hidden');
}

async function uploadPhoto(secId,itemId,file){
  showToast('📤 Subiendo foto...');
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', CLOUDINARY_PRESET);
  try {
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`, {
      method: 'POST', body: formData
    });
    const data = await res.json();
    if (data.secure_url) {
      db.ref(`fabrica_v5/sections/${secId}/items/${itemId}/foto`).set(data.secure_url);
      const item = sectionsData[secId].items[itemId];
      logActivity('Agregó foto', item.code);
      showToast('✓ Foto cargada');
    } else {
      showToast('✗ Error al subir foto');
    }
  } catch(e) {
    showToast('✗ Error al subir foto');
  }
}

function triggerPhotoUpload(secId,itemId){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = (e) => {
    if (e.target.files[0]) uploadPhoto(secId,itemId,e.target.files[0]);
  };
  input.click();
}

function triggerFotoTelaUpload(secId,itemId){
  const input=document.createElement('input');
  input.type='file';input.accept='image/*';
  input.onchange=(e)=>{ if(e.target.files[0]) uploadFotoTela(secId,itemId,e.target.files[0]); };
  input.click();
}

async function uploadFotoTela(secId,itemId,file){
  showToast('📤 Subiendo tela...');
  const formData=new FormData();
  formData.append('file',file);
  formData.append('upload_preset',CLOUDINARY_PRESET);
  try{
    const res=await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`,{method:'POST',body:formData});
    const data=await res.json();
    if(data.secure_url){
      db.ref(`fabrica_v5/sections/${secId}/items/${itemId}/foto_tela`).set(data.secure_url);
      showToast('✓ Tela cargada');
    } else showToast('✗ Error al subir tela');
  }catch(e){ showToast('✗ Error al subir tela'); }
}

function saveItemName(secId,itemId,el){
  const newName = el.textContent.trim();
  const item = sectionsData[secId].items[itemId];
  if (newName === (item.name||'')) return;
  db.ref(`fabrica_v5/sections/${secId}/items/${itemId}/name`).set(newName);
  logActivity('Editó nombre', `${item.code} → ${newName}`);
}

function saveItemCode(secId,itemId,el){
  const newCode = el.textContent.trim();
  const item = sectionsData[secId].items[itemId];
  if (!newCode) { el.textContent = item.code; return; }
  if (newCode === (item.code||'')) return;
  db.ref(`fabrica_v5/sections/${secId}/items/${itemId}/code`).set(newCode);
  checkPasosNuevoDesarrollo(secId,itemId,{code:newCode});
  logActivity('Editó código', `${item.code} → ${newCode}`);
}

function buildPhotoHtml(secId,itemId,item,canEdit){
  if (item.foto) {
    const editBtn = canEdit
      ? `<button class="photo-edit-btn" onclick="event.stopPropagation();triggerPhotoUpload('${secId}','${itemId}')" title="Cambiar foto">✏️</button>`
      : '';
    return `<div class="item-photo-wrap">
      <img class="item-photo" src="${item.foto}" onclick="openPhotoModal('${item.foto}')">
      ${editBtn}
    </div>`;
  }
  if (canEdit) {
    return `<div class="item-photo-placeholder" onclick="triggerPhotoUpload('${secId}','${itemId}')" title="Agregar foto">📷</div>`;
  }
  return '';
}

function buildNameHtml(secId,itemId,item,canEdit){
  if (!canEdit) {
    return item.name ? `<div class="item-name">${item.name}</div>` : '';
  }
  return `<div class="item-name-edit" contenteditable="true" data-secid="${secId}" data-itemid="${itemId}"
    onblur="saveItemName('${secId}','${itemId}',this)"
    onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}">${item.name||''}</div>`;
}

function buildCapasHtml(item){
  const talles=item.capas_talles||[];
  const filas=Object.values(item.capas||{});
  const rows=filas.filter(f=>f&&(f.color||Object.values(f.cant||{}).some(v=>parseInt(v)>0)));
  if(!talles.length||!rows.length) return '';
  const totalPorTalle=talles.map(t=>rows.reduce((s,r)=>s+(parseInt(r.cant&&r.cant[t])||0),0));
  const totalGeneral=totalPorTalle.reduce((a,b)=>a+b,0);
  const headerCols=talles.map(t=>`<th style="padding:2px 6px;font-size:10px;color:var(--text2);text-align:center">${t}</th>`).join('');
  const bodyRows=rows.map(r=>`<tr><td style="padding:2px 6px;font-size:11px;font-weight:600;white-space:nowrap">${(r.color||'—').replace(/</g,'&lt;')}</td>${talles.map(t=>`<td style="padding:2px 6px;font-size:11px;text-align:center">${r.cant&&r.cant[t]?r.cant[t]:'—'}</td>`).join('')}</tr>`).join('');
  const totalCells=totalPorTalle.map(t=>`<td style="padding:2px 6px;font-size:11px;font-weight:700;text-align:center">${t}</td>`).join('');
  return `<div style="margin-top:4px;background:var(--surface2);border-radius:8px;border:1px solid var(--border);padding:6px 8px;overflow-x:auto">
    <div style="font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">🧵 Capas por color</div>
    <table style="border-collapse:collapse;width:100%">
      <thead><tr><th style="text-align:left;padding:2px 6px;font-size:10px;color:var(--text2)">Color</th>${headerCols}</tr></thead>
      <tbody>${bodyRows}<tr style="border-top:1px solid var(--border)"><td style="padding:2px 6px;font-size:11px;font-weight:700">Total</td>${totalCells}</tr></tbody>
    </table>
    <div style="font-size:10px;color:var(--text2);margin-top:2px">Total general: <strong>${totalGeneral}</strong> capas</div>
  </div>`;
}

function buildCodeHtml(secId,itemId,item,canEdit){
  if (!canEdit) return `<div class="item-code">${item.code}</div>`;
  return `<div class="item-code-edit" contenteditable="true" data-secid="${secId}" data-itemid="${itemId}"
    onblur="saveItemCode('${secId}','${itemId}',this)"
    onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}">${item.code}</div>`;
}

function buildModelistaHtml(secId,itemId,item,locked,lockedMsg){
  if(locked){
    return `<div class="modelista-row">
      <span class="modelista-label">Modelista:</span>
      <span style="font-size:11px;color:var(--text3);font-style:italic">${lockedMsg||'Completá los pasos anteriores primero'}</span>
    </div>`;
  }
  const opts=(modelistasList||[]).map(n=>`<option value="${n}" ${item.modelista===n?'selected':''}>${n}</option>`).join('');
  return `<div class="modelista-row">
    <span class="modelista-label">Modelista:</span>
    <select class="modelista-select" onchange="onModelistaChange('${secId}','${itemId}',this)">
      <option value="">— Sin asignar —</option>
      ${opts}
      <option value="__nueva__">+ Agregar nueva…</option>
    </select>
  </div>`;
}

function onModelistaChange(secId,itemId,sel){
  const item=sectionsData[secId].items[itemId];
  if(sel.value==='__nueva__'){
    const nombre=prompt('Nombre de la nueva modelista:');
    if(!nombre||!nombre.trim()){ sel.value=item.modelista||''; return; }
    const limpio=nombre.trim();
    if(!modelistasList.includes(limpio)){
      modelistasList=[...modelistasList,limpio];
      db.ref('fabrica_v5/modelistas').set(modelistasList);
    }
    assignModelista(secId,itemId,limpio);
  } else {
    assignModelista(secId,itemId,sel.value);
  }
}

// Asignar taller a un corte (Cortes listo para taller): mismo patrón que el de modelista.
function buildTallerCorteHtml(secId,itemId,item){
  const opts=(talleresCorteList||[]).map(n=>`<option value="${n}" ${item.taller_corte===n?'selected':''}>${n}</option>`).join('');
  return `<div class="modelista-row">
    <span class="modelista-label">Taller:</span>
    <select class="modelista-select" onchange="onTallerCorteChange('${secId}','${itemId}',this)">
      <option value="">— Sin asignar —</option>
      ${opts}
      <option value="__nuevo__">+ Agregar nuevo…</option>
    </select>

}

function onTallerCorteChange(secId,itemId,sel){
  const item=sectionsData[secId].items[itemId];
  if(sel.value==='__nuevo__'){
    const nombre=prompt('Nombre del nuevo taller:');
    if(!nombre||!nombre.trim()){ sel.value=item.taller_corte||''; return; }
    const limpio=nombre.trim();
    if(!talleresCorteList.includes(limpio)){
      talleresCorteList=[...talleresCorteList,limpio];
      db.ref('fabrica_v5/talleres_corte').set(talleresCorteList);

    assignTallerCorte(secId,itemId,limpio);
  } else {
    assignTallerCorte(secId,itemId,sel.value);
  }

function assignTallerCorte(secId,itemId,nombre){
  const item=sectionsData[secId].items[itemId];
  db.ref(`fabrica_v5/sections/${secId}/items/${itemId}/taller_corte`).set(nombre||null);
  logActivity('Asignó taller de corte',`${item.code} → ${nombre||'sin asignar'}`);
  showToast(nombre?`✓ Taller asignado: ${nombre}`:'Taller desasignado');
}

function assignModelista(secId,itemId,nombre){
  const item=sectionsData[secId].items[itemId];
  const sec=sectionsData[secId];
  if(sec.tipo==='muestra_prep'&&nombre&&!(item.en_ninox&&(item.control_ariel||item.control_stef))){

function onRepoPerfectoChange(secId,itemId,sel){
  if(!sel.value){
    db.ref(`fabrica_v5/sections/${secId}/items/${itemId}`).update({reposicion_ref_sec:null,reposicion_ref_id:null});
    return;
  }
  const [refSec,refId]=sel.value.split('::');
  const ref=sectionsData[refSec]?.items?.[refId];
  const updates={reposicion_ref_sec:refSec,reposicion_ref_id:refId};
  if(ref){
    if(ref.code) updates.code=ref.code;
    if(ref.name) updates.name=ref.name;
    if(ref.marca) updates.marca=ref.marca;
    if(ref.tela) updates.tela=ref.tela;
  }
  db.ref(`fabrica_v5/sections/${secId}/items/${itemId}`).update(updates);
  logActivity('Reposición vinculada',`${ref?.code||ref?.name||''}`);
  showToast('✓ Vinculado — código, nombre, marca y tela completados');
}

// Determina quién es responsable de la próxima acción sobre un ítem
function getResponsable(sec,item,secId){
  const tipo=sec.tipo||'';
  if(tipo==='mejora') return item.mejora_resuelta?null:'Peque';
  if(tipo==='muestra_prep'){
    if(!item.code||!item.code.trim()) return 'Stef';
    if(!item.en_ninox) return 'Peque';
    if(!item.ficha_link) return 'Peque';
    if(!(item.control_ariel||item.control_stef)) return 'Ariel';
    if(!item.modelista) return 'Peque';
    return 'Peque'; // modelista ya asignada: falta que Peque envíe a moldería
  }
  if(tipo==='muestra_molderia'){
    if(!item.foto_drive_ok) return 'Peque';
    return item.modelista||'Peque';
  }
  if(tipo==='muestra_diseno') return 'Ariel y Stef';
  if(tipo==='muestra_pend') return 'Cortador';
  if(tipo==='muestra_cort') return 'Peque';
  if(tipo==='muestra_lista') return 'Peque';
  if(tipo==='muestra_en_taller') return 'Peque';
  if(tipo==='revision_final') return 'Ariel y Stef';
  if(tipo==='producto_perfecto'||tipo==='muestra_cancelada') return null;

  // --- Flujo de cortes (s3, s4, s5, sLT, sFIN) y cualquier sección "normal" custom
  // (como "Pendiente armar tizada"), que no tienen un tipo específico asignado ---
  if(secId==='s3'){
    if(item.sin_confirmar) return 'Ariel';
    const avios=Object.values(item.avios||{});
    if(avios.length && !avios.every(a=>a.recibido)) return 'Peque';
    if(!item.orden_corte_cargada) return 'Ariel';
    return 'Cortador';
  }
  if(secId==='s4') return 'Peque';
  if(secId==='s5') return 'Peque';
  if(secId==='sLT') return 'Emir';
  if(secId==='sFIN') return 'Emir';
  if(!tipo) return 'Peque'; // secciones custom tipo "Pendiente armar tizada": tarea de Peque
  return null;
}

function buildResponsableHtml(sec,item,secId){
  const nombre=getResponsable(sec,item,secId);
  if(!nombre) return '';
  return `<div class="responsable-badge">👤 Responsable tarea: ${nombre}</div>`;
}

function startListening(){
  db.ref('fabrica_v5').once('value',snap=>{
    if(!snap.val()) db.ref('fabrica_v5/sections').set(INITIAL_SECTIONS);
    else{
      // Reparar cualquier sección fija que haya quedado sin metadata (título undefined)
      const data=snap.val();
      if(data.sections){
        Object.keys(INITIAL_SECTIONS).forEach(secId=>{
          const existing=data.sections[secId];
          if(existing && !existing.title){
            const base=INITIAL_SECTIONS[secId];
            db.ref(`fabrica_v5/sections/${secId}`).update({
              title:base.title, color:base.color, order:base.order,
              collapsed:existing.collapsed||false,
              ...(base.tipo?{tipo:base.tipo}:{})
            });
          }
        });
        // Secciones nuevas (Moldería / Diseño) que pueden no existir en cuentas ya en uso
        if(!data.sections[SEC_MOLD]) db.ref(`fabrica_v5/sections/${SEC_MOLD}`).set(INITIAL_SECTIONS[SEC_MOLD]);
        // Detectar por título las secciones de Revisión Final / Mejora / Productos Perfectos
        // que Ariel ya había creado a mano, y darles su comportamiento especial (una sola vez)
        Object.entries(data.sections).forEach(([id,s])=>{
          if(s.tipo) return;
          const t=s.title||'';
          if(t.includes('Revisión Final')) db.ref(`fabrica_v5/sections/${id}/tipo`).set('revision_final');
          else if(t.includes('Productos Perfectos')) db.ref(`fabrica_v5/sections/${id}/tipo`).set('producto_perfecto');
          else if(t.trim()==='Mejora') db.ref(`fabrica_v5/sections/${id}/tipo`).set('mejora');
        });
        if(!data.sections[SEC_DISENO]) db.ref(`fabrica_v5/sections/${SEC_DISENO}`).set(INITIAL_SECTIONS[SEC_DISENO]);
        if(!data.sections[SEC_CANCEL]) db.ref(`fabrica_v5/sections/${SEC_CANCEL}`).set(INITIAL_SECTIONS[SEC_CANCEL]);
        if(!data.sections[SEC_PREP]) db.ref(`fabrica_v5/sections/${SEC_PREP}`).set(INITIAL_SECTIONS[SEC_PREP]);
        else db.ref(`fabrica_v5/sections/${SEC_PREP}/title`).set(INITIAL_SECTIONS[SEC_PREP].title);
        // Migración: si existían las 3 secciones viejas (idea/código/ficha separadas), fusionar sus ítems en SEC_PREP
        ['muestra_idea','muestra_codigo','muestra_ficha'].forEach(oldSecId=>{
          const oldSec=data.sections[oldSecId];
          if(oldSec && oldSec.items){
            Object.values(oldSec.items).forEach(oldItem=>{
              const migrado={...oldItem};
              db.ref(`fabrica_v5/sections/${SEC_PREP}/items`).push(migrado);
            });
          }
          if(oldSec) db.ref(`fabrica_v5/sections/${oldSecId}`).remove();
        });
      }
    }
  });
  let fechasBackfillDone=false;
function backfillFechasIngreso(){
  if(fechasBackfillDone) return;
  if(!(currentUser==='ariel'||currentUser==='stef')) return;
  fechasBackfillDone=true;
  const ahora=Date.now();
  const updates={};
  Object.entries(sectionsData).forEach(([secId,sec])=>{
    Object.entries(sec.items||{}).forEach(([itemId,item])=>{
      if(!item.fecha_ingreso) updates[`fabrica_v5/sections/${secId}/items/${itemId}/fecha_ingreso`]=ahora;
      if(!item.fecha_etapa) updates[`fabrica_v5/sections/${secId}/items/${itemId}/fecha_etapa`]=ahora;
    });
  });
  if(Object.keys(updates).length) db.ref().update(updates);
}
// Backfill del panel "Pasos del proceso": ítems que ya cumplían la condición de un paso antes de que
// existiera este tracking no tenían la fecha guardada, y por eso el panel los mostraba como "pendiente"
// aunque ya estuvieran listos. Esto los marca como Listos (sin poder saber cuánto tardaron realmente).
let pasosBackfillDone=false;
function backfillPasosNuevoDesarrollo(){
  if(pasosBackfillDone) return;
  if(!(currentUser==='ariel'||currentUser==='stef')) return;
  pasosBackfillDone=true;
  const ahora=Date.now();
  const updates={};
  Object.entries(sectionsData).forEach(([secId,sec])=>{
    if(sec.tipo!=='muestra_prep') return;
    Object.entries(sec.items||{}).forEach(([itemId,item])=>{
      if(item.code&&item.code.trim()&&!item.fecha_paso_ingreso) updates[`fabrica_v5/sections/${secId}/items/${itemId}/fecha_paso_ingreso`]=ahora;
      if(item.en_ninox&&item.ficha_link&&!item.fecha_paso_peque) updates[`fabrica_v5/sections/${secId}/items/${itemId}/fecha_paso_peque`]=ahora;
      if((item.control_ariel||item.control_stef)&&!item.fecha_paso_control) updates[`fabrica_v5/sections/${secId}/items/${itemId}/fecha_paso_control`]=ahora;
      if(item.modelista&&!item.fecha_paso_modelista) updates[`fabrica_v5/sections/${secId}/items/${itemId}/fecha_paso_modelista`]=ahora;
    });
  });
  if(Object.keys(updates).length) db.ref().update(updates);
}
// Igual que el backfill de Nuevos Desarrollos, pero para el flujo de "Cortes próximos a sacar" (s3)
let pasosCorteBackfillDone=false;
function backfillPasosCorte(){
  if(pasosCorteBackfillDone) return;
  if(!(currentUser==='ariel'||currentUser==='stef')) return;
  pasosCorteBackfillDone=true;
  const ahora=Date.now();
  const sec=sectionsData['s3'];
  if(!sec) return;
  const updates={};
  Object.entries(sec.items||{}).forEach(([itemId,item])=>{
    if(!item.sin_confirmar&&!item.fecha_paso_confirmado) updates[`fabrica_v5/sections/s3/items/${itemId}/fecha_paso_confirmado`]=ahora;
    if(item.orden_corte_cargada&&!item.fecha_paso_orden) updates[`fabrica_v5/sections/s3/items/${itemId}/fecha_paso_orden`]=ahora;
    if(item.encimado_terminado&&!item.fecha_paso_encimado) updates[`fabrica_v5/sections/s3/items/${itemId}/fecha_paso_encimado`]=ahora;
  });
  if(Object.keys(updates).length) db.ref().update(updates);
}

// AUTO-MOVE muestra: de pendiente → cortada
// --- CANCELAR MUESTRA: se saca del flujo normal y queda archivada en "Canceladas" ---
function cancelarMuestra(secId,itemId){
  const item=sectionsData[secId].items[itemId];
  if(!item) return;
  let motivo=null;
  while(true){
    motivo=prompt('¿Por qué se cancela esta muestra? (obligatorio)',motivo||'');
    if(motivo===null) return; // el usuario canceló el prompt, se aborta la cancelación
    if(motivo.trim()) break;
    alert('El motivo es obligatorio para cancelar la muestra.');
  }
  const origen=sectionsData[secId].title||'';
  const newItem={...item,motivo_cancelacion:motivo.trim(),cancelada_desde:origen,fecha_cancelacion:Date.now(),fecha_etapa:Date.now()};
  db.ref(`fabrica_v5/sections/${SEC_CANCEL}/items`).push(newItem);
  db.ref(`fabrica_v5/sections/${secId}/items/${itemId}`).remove();
  logActivity('Muestra cancelada',`${item.code||item.name||''}${motivo.trim()?' — '+motivo.trim():''}`);
  showToast('🚫 Muestra cancelada');
}

function reactivarMuestra(secId,itemId){
  const item=sectionsData[secId].items[itemId];
  if(!item) return;
  const newItem={...item,fecha_etapa:Date.now()};
  delete newItem.motivo_cancelacion;
  delete newItem.cancelada_desde;
  delete newItem.fecha_cancelacion;
  db.ref(`fabrica_v5/sections/${SEC_PREP}/items`).push(newItem);
  db.ref(`fabrica_v5/sections/${secId}/items/${itemId}`).remove();
  logActivity('Reactivó muestra cancelada',item.code||item.name||'');
  showToast('↩ Vuelve a Nuevos Desarrollos');
}

function diasDesde(timestamp){
  if(!timestamp) return 0;
  const ms = Date.now() - timestamp;
  return Math.floor(ms / (1000*60*60*24));
}

function fmtFecha(timestamp){
  if(!timestamp) return '';
  const d = new Date(timestamp);
  return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
}

function diasEntre(ts){
  if(!ts) return null;
  return Math.floor((Date.now()-ts)/(1000*60*60*24));
}
function diasEntreTs(a,b){
  if(!a) return null;
  return Math.floor(((b||Date.now())-a)/(1000*60*60*24));
}

// Marca automáticamente cuándo se completó cada macro-paso del proceso de Nuevos Desarrollos,
// comparando el item actual con el "patch" recién escrito (el listener de Firebase todavía no
// actualizó sectionsData en este momento, por eso se arma un merge manual acá).
function checkPasosNuevoDesarrollo(secId,itemId,patch){
  const sec=sectionsData[secId]; if(!sec||sec.tipo!=='muestra_prep') return;
  const item=sec.items[itemId]; if(!item) return;
  const merged={...item,...patch};
  const updates={};
  if(merged.code&&String(merged.code).trim()&&!item.fecha_paso_ingreso) updates.fecha_paso_ingreso=Date.now();
  if(merged.en_ninox&&merged.ficha_link&&!item.fecha_paso_peque) updates.fecha_paso_peque=Date.now();
  if((merged.control_ariel||merged.control_stef)&&!item.fecha_paso_control) updates.fecha_paso_control=Date.now();
  if(merged.modelista&&!item.fecha_paso_modelista) updates.fecha_paso_modelista=Date.now();
  if(Object.keys(updates).length){
    const dbUpdates={};
    Object.entries(updates).forEach(([k,v])=>{ dbUpdates[`fabrica_v5/sections/${secId}/items/${itemId}/${k}`]=v; });
    db.ref().update(dbUpdates);
  }
}

function aplicarFiltroYOrdenCorte(items){
  let out=items.filter(([,it])=>
    (!filtroCorteTaller||it.taller_corte===filtroCorteTaller) &&
    (!filtroCorteTela||it.tela===filtroCorteTela) &&
    (!filtroCorteCategoria||it.categoria===filtroCorteCategoria) &&
    (!filtroCorteNumero||(it.numero_corte||'').toLowerCase().includes(filtroCorteNumero.toLowerCase()))
  );
  if(ordenCortePor){
    out=out.slice().sort((a,b)=>String(a[1][ordenCortePor]||'zzz').localeCompare(String(b[1][ordenCortePor]||'zzz')));
  }
  return out;
}

// Cuántos días en la misma etapa se consideran "atrasado", según lo definido para cada proceso
function umbralAtraso(sec,item,secId){
  const tipo=sec.tipo||'';
  if(tipo==='muestra_prep') return 2;      // Nuevos Desarrollos (Peque: Ninox / ficha / enviar a moldería)
  if(tipo==='muestra_molderia') return 2;  // Peque: foto en Drive
  if(tipo==='muestra_cort') return 2;      // Peque: avíos
  if(tipo==='muestra_en_taller') return 3; // Peque: reclamar al taller
  if(tipo==='muestra_lista') return 2;     // Peque: elegir taller
  if(tipo==='mejora') return 2;            // Peque: resolver mejora
  if(tipo==='muestra_pend') return 3;      // Cortador
  if(tipo==='muestra_diseno') return 5;    // Ariel y Stef
  if(tipo==='revision_final') return 5;    // Ariel y Stef
  if(secId==='s4') return 2;               // Peque: pedir avío
  if(secId==='s5') return 7;               // Peque: esperando que llegue el avío
  if(secId==='sLT') return 2;              // Emir: sacar a taller
  if(secId==='sFIN') return 10;            // Emir: marcar entregado
  if(secId==='s3'){
    if(item.sin_confirmar) return 5;       // Ariel: confirmar
    const avios=Object.values(item.avios||{});
    if(avios.length&&!avios.every(a=>a.recibido)) return 3; // Peque: avíos
    if(!item.orden_corte_cargada) return 3; // Ariel: cargar orden de corte
    return 3;                              // Cortador: encimar/cortar
  }
  if(!tipo) return 1; // secciones custom (ej. "Pendiente armar tizada") — Peque
  return 5;
}

// Muestra "Ingresó: fecha · hace X días" y "En esta etapa: hace Y días" en la tarjeta
function procesoInfoHtml(item){
  const parts=[];
  if(item.fecha_ingreso){
    const d=diasEntre(item.fecha_ingreso);
    parts.push(`📅 Ingresó ${fmtFecha(item.fecha_ingreso)} · hace ${d} día${d!==1?'s':''}`);
  }
  if(item.fecha_etapa){
    const d=diasEntre(item.fecha_etapa);
    parts.push(`⏱ En esta etapa hace ${d} día${d!==1?'s':''}`);
  }
  if(!parts.length) return '';
  return `<div style="font-size:11px;color:var(--text2);margin-top:4px">${parts.join(' &nbsp;·&nbsp; ')}</div>`;
}

      html+=`<div class="alert-banner-item" style="background:var(--danger-bg);color:var(--danger)">🔧 ${fichasModificar} ficha${fichasModificar!==1?'s':''} técnica${fichasModificar!==1?'s':''} para modificar</div>`;
    }
  }
  if(currentUser==='ariel'||currentUser==='stef'){
    const sinColor=Object.values(sectionsData[SEC_PEND]?.items||{}).filter(it=>!it.color).length;
    if(sinColor>0){
      html+=`<div class="alert-banner-item" style="background:var(--warn-bg);color:var(--warn-text)">⚠️ ${sinColor} muestra${sinColor!==1?'s':''} sin color asignado</div>`;
    }
  }
  if(currentUser==='emir'||currentUser==='ariel'||currentUser==='stef'){
    const conTaller=Object.values(sectionsData[SEC_LISTA]?.items||{}).filter(it=>it.taller_elegido).length;
    if(conTaller>0){
      html+=`<div class="alert-banner-item" style="background:var(--green-bg);color:var(--green-text)">📦 ${conTaller} muestra${conTaller!==1?'s':''} con taller elegido, list${conTaller!==1?'as':'a'} para marcar enviado</div>`;
    }
  }
  el.innerHTML=html;
}

function renderStats(){
  let total=0,done=0,bloq=0,listas=0,enTaller=0;
  Object.entries(sectionsData).forEach(([secId,sec])=>{
    Object.values(sec.items||{}).forEach(item=>{
      total++;if(item.done)done++;
      if((sec.title||'').toLowerCase().includes('bloqueado'))bloq++;
    });
    if(secId===SEC_LISTA) listas=Object.keys(sec.items||{}).length;
    if(secId===SEC_TALLER) enTaller=Object.keys(sec.items||{}).length;
  });
  document.getElementById('stats-bar').innerHTML=`
    <div class="stat-card"><div class="stat-num">${Object.keys(sectionsData[SEC_PEND]?.items||{}).length}</div><div class="stat-label">Pendiente corte</div></div>
    <div class="stat-card"><div class="stat-num">${Object.keys(sectionsData[SEC_CORT]?.items||{}).length}</div><div class="stat-label">En proceso</div></div>
    <div class="stat-card"><div class="stat-num">${listas}</div><div class="stat-label">Listas para taller</div></div>
    <div class="stat-card"><div class="stat-num">${enTaller}</div><div class="stat-label">En taller</div></div>`;
}

function getSortedItems(sec){
  return Object.entries(sec.items||{}).sort((a,b)=>{
    const oa=a[1].orden, ob=b[1].orden;
    if(oa==null&&ob==null) return 0;
    if(oa==null) return 1;
    if(ob==null) return -1;
    return oa-ob;
  });
}

function getBoard(sec){
  if(sec.board) return sec.board;
  return (sec.tipo||'').startsWith('muestra_') ? 'diseno' : 'fabrica';
}

function extractCorteNumber(item){
  const src = item.numero_corte || item.code || '';
  const m = src.match(/(\d+)/);
  return m ? parseInt(m[1],10) : 999999;
}

function moveSectionOrder(secId,dir){
  const entries=Object.entries(sectionsData).sort((a,b)=>(a[1].order||0)-(b[1].order||0));
  const idx=entries.findIndex(([id])=>id===secId);
  const newIdx=idx+dir;
  if(idx===-1||newIdx<0||newIdx>=entries.length) return;
  const updates={};
  entries.forEach(([id],i)=>{ updates[`fabrica_v5/sections/${id}/order`]=i; });
  const otroId=entries[newIdx][0];
  const tmp=updates[`fabrica_v5/sections/${secId}/order`];
  updates[`fabrica_v5/sections/${secId}/order`]=updates[`fabrica_v5/sections/${otroId}/order`];
  updates[`fabrica_v5/sections/${otroId}/order`]=tmp;
  db.ref().update(updates);
}

    const avios=Object.entries(item.avios||{});
    const moveOpts=buildMoveOpts(secId);

    let aviosPanel='';
    if(llevaAvios===true){

            ?`<span class="avio-badge" style="background:#dcfce7;color:#166534">✓ Entregado</span>`
            :hasDate
              ?`<span class="avio-badge" style="background:#fef3c7;color:#92400e">Pedido ${avio.fecha_pedido}</span>`
              :`<span class="avio-badge" style="background:#fee2e2;color:#991b1b">Sin pedir</span>`;
          const btns=canCheck?`
            ${!rec?`<button class="avio-btn green" onclick="marcarRecibido('${secId}','${itemId}','${avioId}')">✓ Entregado</button>`:
              `<button class="avio-btn" onclick="desmarcarRecibido('${secId}','${itemId}','${avioId}')">↩</button>`}`:'' ;
          return `<div class="avio-item">
            <div class="avio-dot" style="background:${dot}"></div>

      }

      <div class="cortada-row">
        <div class="c-check ${ficha?'checked':''}" onclick="${canCheck?`toggleFicha('${secId}','${itemId}')`:''}">
          ${ficha?'✓':''}
        </div>

      </div>
      <div class="cortada-row">
        <span class="c-label" style="font-weight:500">¿Lleva avíos?</span>

          ${canCheck?`
            <button class="radio-btn ${llevaAvios===true?'selected':''}" onclick="setLlevaAvios('${secId}','${itemId}',true)">Sí</button>

        </div>

      ${llevaAvios===true?`<div class="avios-sub">${aviosPanel}</div>`:''}

    return `<div class="item">

        ${badge}${btns}
      </div>`;
    }).join('')+'</div>';

  const canToggle=(currentUser==='ariel'||currentUser==='stef')||currentUser==='peque';

      <div class="item-code">${item.code}</div>
      ${item.name?`<div class="item-name">${item.name}</div>`:''}

function buildMoveOpts(secId){
  if(currentUser!=='ariel') return '';
  const targets=Object.entries(sectionsData).filter(([id])=>id!==secId).sort((a,b)=>(a[1].order||0)-(b[1].order||0));
  if(!targets.length) return '';
  const opts=targets.map(([id,s])=>`<option value="${id}">${s.title}</option>`).join('');
  return `<select class="move-select" onchange="moveItem('${secId}',null,this.value,this)" onclick="this.dataset.itemId=''">
    <option value="">Mover a...</option>${opts}
  </select>`;
}

// Necesito itemId en el select, lo pongo como data
function buildMoveOptsForItem(secId,itemId){
  if(currentUser!=='ariel') return '';
  const targets=Object.entries(sectionsData).filter(([id])=>id!==secId).sort((a,b)=>(a[1].order||0)-(b[1].order||0));
  if(!targets.length) return '';
  const opts=targets.map(([id,s])=>`<option value="${id}">${s.title}</option>`).join('');
  return `<select class="move-select" onchange="moveItem('${secId}','${itemId}',this.value);this.value=''"><option value="">Mover a...</option>${opts}</select>`;
}

// FLUJO PRE-CORTE: Tiza -> Orden de corte -> Encimado -> (recién ahí) Marcar cortado
function buildFlujoPreCorte(secId,itemId,item,canCortar){
  // Nota: se saca el paso de "¿Tiza hecha?" — un ítem solo llega a "Cortes próximos a sacar"
  // una vez que la tiza ya está hecha, así que preguntarlo acá era redundante. El flujo
  // arranca directo en Orden de corte.
  const ordenCargada=!!item.orden_corte_cargada;
  const encimadoTerm=!!item.encimado_terminado;

  const ordenRow = !ordenCargada
    ? `<div class="cortada-row">
        <span class="c-label" style="font-weight:500;color:var(--warn-text)">⏳ Pendiente orden de corte</span>
        ${canCortar?`<button class="btn-advance" onclick="setOrdenCorteCargada('${secId}','${itemId}',true)">📋 Cargar orden de corte</button>`:''}
      </div>`
    : `<div class="cortada-row">
        <span class="c-label">📋 Orden de corte: <strong style="color:var(--green-text)">Cargada</strong></span>
        ${canCortar&&!encimadoTerm?`<button class="btn-sm" onclick="setOrdenCorteCargada('${secId}','${itemId}',false)">↩ Deshacer</button>`:''}
      </div>`;

  // Orden de corte todavía no cargada.
  if(!ordenCargada){
    return `<div class="cortada-panel" style="margin:8px 0 4px">${ordenRow}</div>`;
  }

  const encimadoRow = !encimadoTerm
    ? `<div class="cortada-row">
        <span class="c-label" style="font-weight:500;color:var(--warn-text)">⏳ Pendiente encimado</span>
        ${canCortar?`<button class="btn-advance" onclick="setEncimadoTerminado('${secId}','${itemId}',true)">🧷 Encimado terminado</button>`:''}
      </div>`
    : `<div class="cortada-row">
        <span class="c-label">🧷 Encimado: <strong style="color:var(--green-text)">Terminado</strong></span>
        ${canCortar?`<button class="btn-sm" onclick="setEncimadoTerminado('${secId}','${itemId}',false)">↩ Deshacer</button>`:''}
      </div>`;

  // Orden de corte cargada, encimado pendiente o recién terminado (acá ya puede aparecer Marcar cortado).
  return `<div class="cortada-panel" style="margin:8px 0 4px">${ordenRow}${encimadoRow}</div>`;
}

function setTizaHecha(secId,itemId,val){
  const item=sectionsData[secId].items[itemId];
  const updates={tiza_hecha:val};
  if(val===null){ updates.orden_corte_cargada=false; updates.encimado_terminado=false; }
  db.ref(`fabrica_v5/sections/${secId}/items/${itemId}`).update(updates);
  logActivity('Tiza',`${item.code}: ${val===null?'deshecho':val?'hecha':'no hecha'}`);
  showToast(val===null?'↩ Tiza sin definir':val?'✓ Tiza hecha':'Tiza no hecha — sigue el flujo');

function setEncimadoTerminado(secId,itemId,val){

// ACTIONS
const SEC_DEFAULTS_CORTE={
  s3b:{title:'Cortes realizados',color:'green',order:4.5},
  s4:{title:'Corte pendiente avío no pedido para sacar a taller',color:'danger',order:5},
  s5:{title:'Cortes pendiente avío para sacar a taller',color:'warn',order:6},
  sLT:{title:'Cortes listo para taller',color:'green',order:6.5},
  sFIN:{title:'Cortes Finalizados',color:'purple',order:7},
};

function ensureSeccionCorte(id){
  if(!sectionsData[id] || !sectionsData[id].title){
    db.ref(`fabrica_v5/sections/${id}`).update({...SEC_DEFAULTS_CORTE[id],collapsed:false});
  }
}

function marcarCorteRealizado(secId,itemId){
  const item=sectionsData[secId].items[itemId];
  const hoy=new Date();
  const fechaDefault=hoy.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
  const fecha=prompt('¿Qué fecha se cortó?',fechaDefault);
  if(fecha===null) return;
  const newItem={...item, fecha_corte:fecha.trim()||fechaDefault, done:true};

  // Ruteo automático según estado de avíos: sin avíos o avíos ya recibidos → listo para taller.
  // Avíos pendientes de pedir → bloqueado sin pedir. Avíos pedidos pero no recibidos → bloqueado esperando entrega.
  const avList=Object.values(item.avios||{});
  let targetSec,toastMsg;
  if(avList.length===0 || avList.every(a=>a.recibido)){
    targetSec='sLT';
    toastMsg=`🎉 ${item.code} cortado y listo para taller`;
  } else if(avList.some(a=>a.fecha_pedido)){
    targetSec='s5';
    toastMsg=`✂️ ${item.code} cortado — esperando que llegue el avío pedido`;
  } else {
    targetSec='s4';
    toastMsg=`✂️ ${item.code} cortado — falta pedir avío`;
  }

  // Asegurar metadata de la sección destino (por si no existía aún en Firebase)
  ensureSeccionCorte(targetSec);
  db.ref(`fabrica_v5/sections/${targetSec}/items`).push(newItem);
  db.ref(`fabrica_v5/sections/${secId}/items/${itemId}`).remove();
  const targetTitle=sectionsData[targetSec]?.title||SEC_DEFAULTS_CORTE[targetSec].title;
  logActivity('Corte realizado',`${item.code} — ${fecha.trim()||fechaDefault} → ${targetTitle}`);
  showToast(toastMsg);
}

function checkCorteListoParaTaller(secId,itemId,avios){
  if(secId!=='s4'&&secId!=='s5'&&secId!=='s3b') return;
  const item=sectionsData[secId]?.items?.[itemId];
  if(!item) return;
  const avList=Object.values(avios||{});
  if(avList.length===0 || !avList.every(a=>a.recibido)) return;
  ensureSeccionCorte('sLT');
  setTimeout(()=>{
    db.ref(`fabrica_v5/sections/sLT/items`).push({...item,avios});
    db.ref(`fabrica_v5/sections/${secId}/items/${itemId}`).remove();
    logActivity('Corte listo para taller',item.code);
    showToast(`🎉 ${item.code} listo para taller`);
  },400);
}

function checkCorteVuelveABloqueado(secId,itemId,avios){
  if(secId!=='sLT') return;
  const item=sectionsData[secId]?.items?.[itemId];
  if(!item) return;
  const avList=Object.values(avios||{});
  if(avList.length===0 || avList.every(a=>a.recibido)) return; // sigue sin necesitar nada, se queda
  const targetSec=avList.some(a=>a.fecha_pedido)?'s5':'s4';
  ensureSeccionCorte(targetSec);
  setTimeout(()=>{
    db.ref(`fabrica_v5/sections/${targetSec}/items`).push({...item,avios});
    db.ref(`fabrica_v5/sections/${secId}/items/${itemId}`).remove();
    logActivity('Corte vuelve a bloqueado',item.code);
    showToast(`⚠️ ${item.code} volvió a bloqueado — falta avío`);
  },400);
}

function sacarATaller(secId,itemId){
  const item=sectionsData[secId].items[itemId];
  if(!item.taller_corte){ showToast('Asigná un taller antes de sacarlo'); return; }
  if(!confirm(`¿Confirmás que ${item.code} salió a ${item.taller_corte}? Se cierra el ciclo.`)) return;
  const newItem={...item, fecha_salida_taller:Date.now()};
  ensureSeccionCorte('sFIN');
  db.ref(`fabrica_v5/sections/sFIN/items`).push(newItem);
  db.ref(`fabrica_v5/sections/${secId}/items/${itemId}`).remove();
  logActivity('Corte sacado a taller',`${item.code} → ${item.taller_corte}`);
  showToast(`📦 ${item.code} salió a ${item.taller_corte}`);
}

function deshacerCorte(secId,itemId){
  const item=sectionsData[secId].items[itemId];
  const newItem={...item, done:false};
  delete newItem.fecha_corte;
  if(!sectionsData['s3'] || !sectionsData['s3'].title){
    db.ref('fabrica_v5/sections/s3').update({title:'Cortes próximos a sacar',color:'accent',order:4,collapsed:false});

  db.ref(`fabrica_v5/sections/s3/items`).push(newItem);
  db.ref(`fabrica_v5/sections/${secId}/items/${itemId}`).remove();
  logActivity('Deshizo corte',item.code);
  showToast(`↩ ${item.code} volvió a próximos a sacar`);
}

function moveCorteOrder(secId,itemId,dir){
  const sec=sectionsData[secId];
  const items=getSortedItems(sec);
  const idx=items.findIndex(([id])=>id===itemId);
  const newIdx=idx+dir;
  if(idx===-1||newIdx<0||newIdx>=items.length) return;
  const updates={};
  items.forEach(([id],i)=>{ updates[`fabrica_v5/sections/${secId}/items/${id}/orden`]=i; });
  const otroId=items[newIdx][0];
  const tmp=updates[`fabrica_v5/sections/${secId}/items/${itemId}/orden`];
  updates[`fabrica_v5/sections/${secId}/items/${itemId}/orden`]=updates[`fabrica_v5/sections/${secId}/items/${otroId}/orden`];
  updates[`fabrica_v5/sections/${secId}/items/${otroId}/orden`]=tmp;
  db.ref().update(updates);
}

// Mueve el ítem a la siguiente sección (según el orden de columnas del mismo tablero),
// para no depender siempre del desplegable "Mover a..."
function siguientePaso(secId,itemId){
  const sec=sectionsData[secId];
  if(!sec) return;
  const board=getBoard(sec);
  const entries=Object.entries(sectionsData).filter(([,s])=>getBoard(s)===board).sort((a,b)=>(a[1].order||0)-(b[1].order||0));
  const idx=entries.findIndex(([id])=>id===secId);
  if(idx===-1||idx>=entries.length-1){ showToast('Ya está en el último paso'); return; }
  const nextId=entries[idx+1][0];
  moveItem(secId,itemId,nextId);
}

function checkListaParaTaller(secId,itemId,ficha,llevaAvios,avios){
  const item=sectionsData[secId]?.items?.[itemId];
  if(!item) return;
  if(sectionsData[secId].tipo!=='muestra_cort') return;
  if(!ficha) return;
  if(llevaAvios===false){setTimeout(()=>moverALista(secId,itemId),500);return;}
  if(llevaAvios===true){
    const avList=Object.values(avios||{});
    if(avList.length>0&&avList.every(a=>a.recibido)) setTimeout(()=>moverALista(secId,itemId),500);
  }
}

// ---- Editor de capas por color/talle ----
function syncCapasFromDOM(){
  const container=document.getElementById('capas-table-wrap');
  if(!container) return;
  const rowEls=container.querySelectorAll('.capa-row');
  if(rowEls.length===0) return; // aún no renderizado, no pisar el estado
  const rows=[];
  rowEls.forEach(rowEl=>{
    const id=rowEl.dataset.rowid;
    const colorInp=rowEl.querySelector('.capa-color');
    const color=colorInp?colorInp.value:'';
    const cant={};
    rowEl.querySelectorAll('.capa-qty').forEach(q=>{ cant[q.dataset.talle]=q.value; });
    rows.push({id,color,cant});
  });
  editCtx.capasRows=rows;
}

function renderCapasEditor(){
  const wrap=document.getElementById('capas-table-wrap');
  if(!wrap) return;
  const talles=editCtx.capasTalles||[];
  const rows=editCtx.capasRows||[];
  if(!talles.length){
    wrap.innerHTML=`<div style="font-size:12px;color:var(--text3);font-style:italic">Definí los talles arriba y tocá "Actualizar" para armar la tabla.</div>`;
    return;
  }
  const headerCols=talles.map(t=>`<th style="padding:4px;font-size:11px;color:var(--text2)">${t}</th>`).join('');
  const bodyRows=rows.map(row=>{
    const qtyCells=talles.map(t=>`<td style="padding:2px"><input type="number" min="0" class="capa-qty" data-talle="${t}" value="${row.cant[t]!==undefined&&row.cant[t]!==''?row.cant[t]:''}" style="width:48px;padding:4px;font-size:12px;text-align:center;border:1px solid var(--border);border-radius:4px"></td>`).join('');
    return `<tr class="capa-row" data-rowid="${row.id}">
      <td style="padding:2px"><input type="text" class="capa-color" value="${(row.color||'').replace(/"/g,'&quot;')}" placeholder="Color" style="width:100px;padding:4px;font-size:12px;border:1px solid var(--border);border-radius:4px"></td>
      ${qtyCells}
      <td><button class="btn-danger" style="padding:2px 6px;font-size:11px" onclick="removeCapaRow('${row.id}')">✕</button></td>
    </tr>`;
  }).join('');
  wrap.innerHTML=`<table style="border-collapse:collapse;width:100%">
    <thead><tr><th style="padding:4px;font-size:11px;color:var(--text2);text-align:left">Color</th>${headerCols}<th></th></tr></thead>
    <tbody>${bodyRows}</tbody>
  </table>`;
}

  if(!editCtx.capasRows||editCtx.capasRows.length===0) editCtx.capasRows=[{id:'r'+Date.now(),color:'',cant:{}}];
  renderCapasEditor();
}

function saveEditItem(){
  const{secId,itemId,newAvioCount}=editCtx;
  const item=sectionsData[secId].items[itemId];
  const sec=sectionsData[secId];
  const esCorte=!sec.tipo;
  const updates={
    code:document.getElementById('e-code').value.trim(),
    name:document.getElementById('e-name').value.trim(),
    numero_corte:document.getElementById('e-numcorte').value.trim(),
    sub:document.getElementById('e-tela').value.trim(),
  };
  if(esCorte){

    const capasObj={};
    (editCtx.capasRows||[]).forEach(row=>{
      const tieneAlgo=row.color||Object.values(row.cant||{}).some(v=>parseInt(v)>0);
      if(!tieneAlgo) return;
      const cantLimpio={};
      Object.entries(row.cant||{}).forEach(([t,v])=>{ if(v!==''&&v!==undefined&&v!==null) cantLimpio[t]=parseInt(v)||0; });
      capasObj[row.id]={color:row.color||'',cant:cantLimpio};
    });
    updates.capas_talles=editCtx.capasTalles||[];
    updates.capas=capasObj;
  }
  db.ref(`fabrica_v5/sections/${secId}/items/${itemId}`).update(updates);
  Object.keys(item.avios||{}).forEach(avioId=>{
    const n=document.getElementById(`an-${avioId}`);
    if(n) db.ref(`fabrica_v5/sections/${secId}/items/${itemId}/avios/${avioId}`).update({
      nombre:n.value.trim(),
      proveedor:(document.getElementById(`ap-${avioId}`)?.value||'').trim(),
      fecha_pedido:(document.getElementById(`af-${avioId}`)?.value||'').trim(),
    });
  });
  for(let i=1;i<=newAvioCount;i++){
    const n=document.getElementById(`an-new${i}`);
    if(n&&n.value.trim()) db.ref(`fabrica_v5/sections/${secId}/items/${itemId}/avios`).push({
      nombre:n.value.trim(),
      proveedor:(document.getElementById(`ap-new${i}`)?.value||'').trim(),
      fecha_pedido:(document.getElementById(`af-new${i}`)?.value||'').trim(),
      recibido:false
    });
  }
  logActivity('Editó ítem',document.getElementById('e-code').value.trim());
  document.getElementById('modal-edit').classList.add('hidden');
  showToast('Cambios guardados');
}

async function descargarBackup(){
  try{
    showToast('Generando backup...');
    const snap=await db.ref('fabrica_v5').once('value');
    const data=snap.val()||{};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const fecha=new Date().toISOString().slice(0,10);
    const a=document.createElement('a');
    a.href=url;
    a.download=`backup-fabrica-${fecha}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('✓ Backup descargado');
  }catch(e){
    showToast('Error al generar el backup');
  }
}

function colorForPersonName(name){
  const palette=['#8b4a2b','#5b4e9e','#2f6b4f','#b45309','#0e7490','#9d174d','#4d7c0f','#6d28d9'];
  let hash=0;
  for(let i=0;i<name.length;i++){ hash = name.charCodeAt(i) + ((hash<<5)-hash); }
  return palette[Math.abs(hash)%palette.length];
}
// Galería: todas las fotos de la colección activa, separadas por tablero (Diseño / Fábrica),
// que se pueden arrastrar libremente para reordenar. El orden queda guardado en Firebase.
function renderGaleria(){
  const cont=document.getElementById('galeria-content');
  // Juntar TODOS los items de los dos tableros, para armar las opciones de los filtros.
  // Se dejan afuera las etapas que ya están "cerradas": Productos Perfectos, Muestras Canceladas
  // y Revisión Final (esos cortes ya fueron entregados por el taller).
  const todos=[];
  Object.entries(sectionsData).forEach(([secId,sec])=>{
    if(sec.tipo==='producto_perfecto'||sec.tipo==='muestra_cancelada'||sec.tipo==='revision_final') return;
    Object.entries(sec.items||{}).forEach(([itemId,item])=>{
      const board=getBoard(sec);
      const etapa=board==='diseno'?'Diseño':(secId==='sFIN'?'En taller':'Fábrica');
      const marca=item.marca||marcasList[0]||'By Nina'; // igual que en el resto de la app: sin marca cargada = la primera de la lista
      todos.push({secId,itemId,item,secTitle:sec.title,board,etapa,marca});
    });
  });
  // La marca usa la lista maestra (marcasList), no solo lo que aparece en los items —
  // así "By Nina" siempre está aunque sea el valor implícito y nadie lo haya tildado a mano.
  const marcas=marcasList||[];
  const telas=[...new Set(todos.map(it=>it.item.tela).filter(Boolean))].sort();
  const categorias=[...new Set(todos.map(it=>it.item.categoria).filter(Boolean))].sort();
  const opt=(list,val)=>list.map(v=>`<option value="${v}" ${val===v?'selected':''}>${v}</option>`).join('');
  const filtroBar=`<div class="filtro-corte-bar" style="margin-bottom:14px">
    <select class="filtro-corte-select" onchange="filtroGaleriaTablero=this.value;renderGaleria()">
      <option value="" ${!filtroGaleriaTablero?'selected':''}>Tablero: ambos</option>
      <option value="diseno" ${filtroGaleriaTablero==='diseno'?'selected':''}>Solo Diseño</option>
      <option value="fabrica" ${filtroGaleriaTablero==='fabrica'?'selected':''}>Solo Fábrica</option>
    </select>
    <select class="filtro-corte-select" onchange="filtroGaleriaMarca=this.value;renderGaleria()">
      <option value="">Marca: todas</option>${opt(marcas,filtroGaleriaMarca)}
    </select>
    <select class="filtro-corte-select" onchange="filtroGaleriaTela=this.value;renderGaleria()">
      <option value="">Tela: todas</option>${opt(telas,filtroGaleriaTela)}
    </select>
    <select class="filtro-corte-select" onchange="filtroGaleriaCategoria=this.value;renderGaleria()">
      <option value="">Categoría: todas</option>${opt(categorias,filtroGaleriaCategoria)}
    </select>
    ${(filtroGaleriaTablero||filtroGaleriaMarca||filtroGaleriaTela||filtroGaleriaCategoria)?`<button class="btn-sm" onclick="filtroGaleriaTablero='';filtroGaleriaMarca='';filtroGaleriaTela='';filtroGaleriaCategoria='';renderGaleria()">✕ Limpiar</button>`:''}
  </div>`;
  const filtrados=todos.filter(it=>
    (!filtroGaleriaMarca||it.marca===filtroGaleriaMarca) &&
    (!filtroGaleriaTela||it.item.tela===filtroGaleriaTela) &&
    (!filtroGaleriaCategoria||it.item.categoria===filtroGaleriaCategoria)
  );
  let html=filtroBar;
  (filtroGaleriaTablero?[filtroGaleriaTablero]:['diseno','fabrica']).forEach(board=>{
    const items=filtrados.filter(it=>it.board===board);
    const orden=galeriaOrden[board]||[];
    const keyOf=it=>`${it.secId}::${it.itemId}`;
    items.sort((a,b)=>{
      const ia=orden.indexOf(keyOf(a)), ib=orden.indexOf(keyOf(b));
      if(ia===-1&&ib===-1) return 0;
      if(ia===-1) return 1;
      if(ib===-1) return -1;
      return ia-ib;
    });
    const tiles=items.map(it=>`
      <div class="galeria-tile" draggable="true" data-key="${keyOf(it)}" data-board="${board}"
           ondragstart="onGaleriaDragStart(event)" ondragend="onGaleriaDragEnd(event)"
           ondragover="onGaleriaDragOver(event)" ondrop="onGaleriaDrop(event)">
        ${it.item.foto?`<img src="${it.item.foto}" onclick="openPhotoModal('${it.item.foto}')">`:`<div class="galeria-tile-sinfoto">📷</div>`}
        <div class="galeria-tile-info">
          <span class="galeria-tile-code">${it.item.code||it.item.name||'(sin código)'}</span>
          <span class="galeria-tile-etapa etapa-${it.etapa==='Diseño'?'diseno':it.etapa==='En taller'?'finalizados':'fabrica'}">${it.etapa}</span>
          <span class="galeria-tile-sec">${it.secTitle}</span>
        </div>
      </div>`).join('');
    html+=`<div class="galeria-board">
      <div class="galeria-board-title">${board==='diseno'?'🎨 Diseño':'🏭 Fábrica'} <span class="sec-count">${items.length}</span></div>
      <div class="galeria-grid">${tiles||'<div class="empty-state">No hay fotos que coincidan acá</div>'}</div>
    </div>`;
  });
  cont.innerHTML=html;
}
let galeriaDragKey=null;
function onGaleriaDragStart(ev){
  galeriaDragKey=ev.currentTarget.dataset.key;
  ev.dataTransfer.effectAllowed='move';
  ev.dataTransfer.setData('text/plain',galeriaDragKey);
  setTimeout(()=>ev.currentTarget.classList.add('dragging'),0);
}
function onGaleriaDragEnd(ev){ ev.currentTarget.classList.remove('dragging'); galeriaDragKey=null; }
function onGaleriaDragOver(ev){ if(galeriaDragKey){ ev.preventDefault(); ev.dataTransfer.dropEffect='move'; } }
function onGaleriaDrop(ev){
  ev.preventDefault();
  if(!galeriaDragKey) return;
  const targetKey=ev.currentTarget.dataset.key, board=ev.currentTarget.dataset.board;
  if(!targetKey||targetKey===galeriaDragKey){ galeriaDragKey=null; return; }
  const grid=ev.currentTarget.closest('.galeria-grid');
  const keys=[...grid.querySelectorAll('.galeria-tile')].map(el=>el.dataset.key);
  const from=keys.indexOf(galeriaDragKey), to=keys.indexOf(targetKey);
  if(from===-1||to===-1){ galeriaDragKey=null; return; }
  keys.splice(from,1); keys.splice(to,0,galeriaDragKey);
  galeriaOrden[board]=keys; galeriaDragKey=null;
  db.ref(`fabrica_v5/galeria_orden/${board}`).set(keys);
  renderGaleria();
}

function renderPendientes(){
  const cont=document.getElementById('pendientes-list');
  const grupos={};
  Object.entries(sectionsData).forEach(([secId,sec])=>{
    Object.entries(sec.items||{}).forEach(([itemId,item])=>{
      if(item.done) return;
      if(filtroMarca&&(item.marca||marcasList[0]||'By Nina')!==filtroMarca) return;
      const resp=getResponsable(sec,item,secId);
      if(!resp) return;
      const dias=diasEntre(item.fecha_etapa);
      const umbral=umbralAtraso(sec,item,secId);
      const atrasado=dias!==null&&dias>=umbral;
      if(!grupos[resp]) grupos[resp]=[];
      grupos[resp].push({item,secTitle:sec.title,secId,itemId,dias,atrasado});
    });
  });
  const esAriel=(currentUser==='ariel'||currentUser==='stef');
  const miNombre=USER_DISPLAY[currentUser];
  let nombres=esAriel?Object.keys(grupos).sort():[miNombre];
  // Ordenar: quien tiene más atrasados primero, para dar un panorama claro de quién está más complicado
  if(esAriel){
    nombres=nombres.sort((a,b)=>{
      const atA=(grupos[a]||[]).filter(x=>x.atrasado).length;
      const atB=(grupos[b]||[]).filter(x=>x.atrasado).length;
      if(atA!==atB) return atB-atA;
      return a.localeCompare(b);
    });
  }
  let html='';
  nombres.forEach(nombre=>{
    const lista=(grupos[nombre]||[]).slice().sort((a,b)=>{
      if(a.atrasado!==b.atrasado) return a.atrasado?-1:1;
      return (b.dias||0)-(a.dias||0);
    });
    if(!lista.length) return;
    const color=colorForPersonName(nombre);
    const numAtrasados=lista.filter(x=>x.atrasado).length;
    html+=`<div class="pendientes-group-title" style="color:${color}">${nombre}<span class="sec-count" style="background:${color}22;color:${color}">${lista.length}</span>${numAtrasados?`<span class="sec-count" style="background:#fee2e2;color:#991b1b">⚠️ ${numAtrasados} atrasado${numAtrasados!==1?'s':''}</span>`:''}</div>`;
    html+=`<div class="pendientes-grid">`;
    lista.forEach(({item,secTitle,secId,itemId,dias,atrasado})=>{
      html+=`<div class="pendientes-card" style="border-left:4px solid ${atrasado?'#dc2626':color};cursor:pointer" onclick="irAItem('${secId}','${itemId}')">
        <div class="item-code">${item.code||item.name||'(sin código)'}</div>
        ${item.name&&item.code?`<div class="item-name">${item.name}</div>`:''}
        <div class="pendientes-etapa">${secTitle}</div>
        ${dias!==null?`<div class="pendientes-etapa" style="font-weight:700;margin-top:2px;color:${atrasado?'#dc2626':'var(--text3)'}">${atrasado?'⚠️ ':''}${dias} día${dias!==1?'s':''} en esta etapa</div>`:''}
      </div>`;
    });
    html+=`</div>`;
  });
  cont.innerHTML=html||`<div class="empty-state">No hay pendientes por ahora 🎉</div>`;
}

// Al tocar una tarjeta en "Pendientes", saltar directo al tablero y tablero correspondiente,
// abrir la sección si estaba colapsada, y resaltar el ítem para encontrarlo rápido.
function irAItem(secId,itemId){
  const sec=sectionsData[secId];
  if(!sec) return;
  const board=getBoard(sec);
  const tabId = board==='diseno'?'tab-diseno':'tab-fabrica';
  const btnId = board==='diseno'?'tab-btn-diseno':'tab-btn-fabrica';
  ocultarTabsMenosActiva(tabId);
  document.getElementById(btnId).classList.add('active');
  if(isSecCollapsed(secId)){
    localCollapsed[secId]=false;
    saveLocalCollapsed();
  }
  renderSections('diseno');
  renderSections('fabrica');
  setTimeout(()=>{
    const el=document.getElementById(`item-${secId}-${itemId}`);
    if(!el){ showToast('No encontré ese ítem (puede que ya se haya movido o eliminado)'); return; }
    el.scrollIntoView({behavior:'smooth',block:'center'});
    el.classList.add('item-highlight');
    setTimeout(()=>el.classList.remove('item-highlight'),2200);
  },50);
}

function fmtTime(ts){
  if(!ts)return'';
  const d=new Date(ts);
  return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
}

// TABS
function ocultarTabsMenosActiva(activo){
  ['tab-diseno','tab-fabrica','tab-pendientes','tab-galeria','tab-actividad'].forEach(id=>{
    document.getElementById(id).classList.toggle('hidden', id!==activo);
  });
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
}
document.getElementById('tab-btn-diseno').onclick=function(){
  ocultarTabsMenosActiva('tab-diseno');
  this.classList.add('active');
};
document.getElementById('tab-btn-fabrica').onclick=function(){
  ocultarTabsMenosActiva('tab-fabrica');
  this.classList.add('active');
};
document.getElementById('tab-btn-pendientes').onclick=function(){
  ocultarTabsMenosActiva('tab-pendientes');
  this.classList.add('active');
  renderPendientes();
};
document.getElementById('tab-btn-galeria').onclick=function(){
  ocultarTabsMenosActiva('tab-galeria');
  this.classList.add('active');
  renderGaleria();
};
document.getElementById('tab-btn-actividad').onclick=function(){
  ocultarTabsMenosActiva('tab-actividad');
  this.classList.add('active');
  renderActividad();
};

document.getElementById('cancel-modal-edit').onclick=()=>document.getElementById('modal-edit').classList.add('hidden');

document.getElementById('close-modal-sec').onclick=()=>document.getElementById('modal-sec').classList.add('hidden');
document.getElementById('cancel-modal-sec').onclick=()=>document.getElementById('modal-sec').classList.add('hidden');
